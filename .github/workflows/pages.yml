name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - run: bun run build
      - name: Include portrait in static site
        env:
          ASSET_ORIGIN: https://spark-discovery-grow.lovable.app
        run: |
          python3 - <<'PY'
          import json, os, pathlib, subprocess
          pointer = json.loads(pathlib.Path('src/assets/emre-guney-portrait.webp.asset.json').read_text())
          asset_path = pointer['url']
          assert asset_path.startswith('/__l5e/assets-v1/') and '..' not in asset_path
          target = pathlib.Path('.output/public') / asset_path.lstrip('/')
          target.parent.mkdir(parents=True, exist_ok=True)
          subprocess.run(['curl', '--fail', '--location', '--retry', '3', '--max-time', '60', os.environ['ASSET_ORIGIN'] + asset_path, '--output', str(target)], check=True)
          data = target.read_bytes()
          assert len(data) == pointer['size'], 'Incomplete portrait download'
          assert data[:4] == b'RIFF' and data[8:12] == b'WEBP', 'Portrait is not a WebP image'
          PY
      - name: Verify static homepage
        run: |
          test -s .output/public/index.html
          grep -q "Emre Güney" .output/public/index.html
          echo "emreguneyteacher.com" > .output/public/CNAME
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .output/public
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
